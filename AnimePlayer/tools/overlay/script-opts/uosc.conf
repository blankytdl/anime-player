# script-opts/uosc.conf
# ==========================================
# mpv-anime-build v1.7 - GLASS LOOK + UI
# uosc 5.13.0
# ==========================================

# --- DISPLAY ---
scale=1.0
font_scale=0.9
autohide=yes

# --- TOP BAR ---
top_bar=no-border
top_bar_size=40
top_bar_controls=right
top_bar_title=yes
top_bar_alt_title=${filename}
top_bar_alt_title_place=toggle
top_bar_flash_on=video,audio
top_bar_persistency=
window_border_size=1

# --- TIMELINE ---
timeline_style=bar
timeline_line_width=2
timeline_size=20
timeline_cache=yes
timeline_border=1
timeline_heatmap=overlay
timeline_persistency=
timeline_mbtn_right=
progress=never
destination_time=playtime-remaining

# --- CONTROLS ---
# Added: command:tune:script-binding open-controls-menu?Controls
controls=space,menu,command:palette:script-binding open-anime-menu?Anime Mode,command:hdr_on:script-binding open-hdr-toys-menu?HDR Toys,command:tune:script-binding open-controls-menu?Controls,command:keyboard:script-message ap-keybinds-open?Key bindings (change keys),command:blur_on:script-message toggle-crop-ambient?Ambient Crop,command:info:script-binding stats/display-stats-toggle?Media Info,command:analytics:script-binding toggle-stats?Statistics,speed,command:restart_alt:script-message speed-reset?Reset speed,cycle:repeat:loop-file:no/inf!?Loop File,command:speaker:script-binding uosc/audio?Audio Tracks,subtitles,<has_sub>command:format_list_bulleted:script-binding subtitle_lines/list_subtitles?Subtitle Lines,space,prev,<has_chapter>command:fast_rewind:add chapter -1?Prev Chapter,<video>command:arrow_left:frame-back-step?Previous frame,play-pause,<video>command:arrow_right:frame-step?Next frame,<has_chapter>command:fast_forward:add chapter 1?Next Chapter,next,space,command:history:script-binding uosc/history?History,command:restore:script-message ap-resume-now?Resume where you stopped,command:replay:script-message ap-restart-now?Start from the beginning,command:folder_special:script-message ap-show-in-explorer?Show file in Explorer,<audio>command:power_settings_new:script-message toggle-vis-state?Toggle Visualizer,<audio>command:waves:script-message cycle-vis-style?Cycle Style,<audio>command:photo_library:script-message cycle-album-art?Cycle Album Art,<audio>command:music_note:script-message show-audio-metadata?Track Info,<stream>command:download:script-message-to youtube_download menu?Download,command:camera_alt:screenshot?Screenshot,<video>command:add_a_photo:screenshot video?Screenshot without subtitles,command:picture_in_picture_alt:script-message toggle-pip?PiP Mode,<video>command:aspect_ratio:script-message ap-aspect-cycle?Change aspect ratio,<video>command:rotate_right:script-message ap-rotate?Rotate video,<video>command:fit_screen:script-message ap-zoom-off?Zoom: Fit (original picture),<video>command:zoom_out_map:script-message ap-zoom-fill?Zoom: Forced (fills the window),<video>command:crop:script-message ap-zoom-crop?Zoom: Forced + crop black bars,cycle:push_pin:ontop:no/yes!?Pin Window,fullscreen,space
controls_size=40
controls_margin=12
controls_spacing=6
# --- VOLUME ---
volume=right
volume_size=40

# --- BEHAVIOR ---
languages=slang,en,eng,jpn,ja
subtitles_directory=~~/subtitles
load_types=video,audio
adjust_osd_margins=yes
default_directory=~/
flash_duration=2000
show_hidden_files=no
image_types=

# --- VISUALS (Correct Glass Method) ---

# Border radius of buttons, menus, and all other rectangles
border_radius=8

# 1. BORDER
# Essential for readability on glass backgrounds
text_border=1.5

# 2. OPACITY OVERRIDES
# UPDATED:
# title=0.4   -> Top Title Bar is now transparent (Glass).
# slider=0.4  -> Volume Panel is now transparent (Glass).
# speed=0.4   -> Speed Slider is now transparent (Glass).
#
# (Preserved the settings: menu=0.4, curtain=0.05, etc.)
opacity=menu=0.5,submenu=0.5,curtain=0.05,timeline=0.5,position=1,chapters=0.8,slider=0.4,slider_gauge=1,controls=0.05,speed=0.4,title=0.4,tooltip=1,thumbnail=1,idle_indicator=0.8,audio_indicator=0.5,buffering_indicator=0.3,playlist_position=0.8,heatmap=0.4

# 3. COLOR PALETTE
color=foreground=fb8c00,foreground_text=000000,background=101218,background_text=ffffff,curtain=000000,success=fb8c00,error=c8202c

chapter_ranges=openings:00ff0080,endings:0080ff80,outros:ff990080,intros:ff00ff80,ads:c54e4e80
chapter_range_patterns=openings:opening, op ,♪ op,♪op,^op$,op%d,theme song,main theme,オープニング,オープニングテーマ,OPテーマ,主題歌,ncop,creditless op,creditless opening;endings:ending, ed ,♪ ed,♪ed,^ed$,ed%d,credits,outro,end roll,エンディング,エンディングテーマ,EDテーマ,結び,nced,creditless ed,creditless ending;outros:preview, pv ,^pv$,pv%d,trailer,next episode,予告,次回予告,特報,プロモーション,jikai,yokoku;intros:intro,introduction,prologue,cold open,アバン,アバンタイトル,序章,前説

