# Seek-bar preview settings. mpv_path is filled in by build.bat / 00-thumbfast-path.lua.
# Needs a STANDALONE mpv.exe (see mpv-exe\PUT_MPV_EXE_HERE.txt) - mpv.net only embeds libmpv.
spawn_first=yes
network=no
hwdec=no

# build 37: background prefetch of a coarse frame grid (hovering shows the nearest frame instantly). prefetch=no switches it off.
prefetch=yes
prefetch_max=64
prefetch_delay=2
