# tabs  = every tab has its own "next file": Playlist videos go on with the playlist, videos started from the Queue tab go on with the queue
# after = the old behaviour: the queue always plays right after the current video
queue_mode=tabs
# only video, gif and audio formats in the Playlist / Queue tabs (no pictures, subtitles, other files)
video_only=yes
# the same video is listed once per tab
dedupe=yes
# links (http ...) cannot be judged by an extension: yes = keep them, no = local video files only
allow_urls=yes
