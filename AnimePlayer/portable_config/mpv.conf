# ===== AnimePlayer mpv.conf (compatible with Chinna95P/mpv-anime-build layout) =====
# Tuned for RX 580 (Polaris, Vulkan/D3D11) + i5-3470 (4C/4T Ivy Bridge, no AVX2)
profile=gpu-hq
vo=gpu-next
gpu-api=d3d11
gpu-context=d3d11
hwdec=d3d11va-copy
hwdec-codecs=h264,hevc,vp9,av1,mpeg2video,vc1
vd-lavc-threads=4
video-sync=display-resample
interpolation=no
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
deband=yes
deband-iterations=2
deband-threshold=35
deband-range=20
deband-grain=5
dither-depth=auto
cache=yes
demuxer-max-bytes=150MiB
demuxer-max-back-bytes=50MiB
osc=no
osd-bar=no
border=yes
keep-open=yes

# ---- smoother seeking / pausing (round 25) ----
# exact seeks (lands on the frame you asked for) that drop frames while decoding up to it = fast on the i5-3470
hr-seek=yes
hr-seek-framedrop=yes
# read further ahead so a jump forward finds its data already in memory
demuxer-readahead-secs=30
cache-secs=60
# no audio click / stutter when pausing and resuming
audio-buffer=0.3
audio-stream-silence=no
# free window resizing (the player also enforces this from Settings)
keepaspect-window=no
sub-auto=fuzzy
audio-file-auto=fuzzy
slang=en,eng
alang=ja,jpn,en,eng
screenshot-format=png
screenshot-directory=C:/Users/Mahdi/Pictures
input-ipc-server=\\.\pipe\animeplayer-mpv
script-opts-append=animeplayer-queue-file=~~/queue.json

gpu-shader-cache-dir=~~/cache
icc-cache-dir=~~/cache
# Settings window writes overrides.conf (GPU API / hwdec). Must stay above the profile sections.
include=~~/overrides.conf

# ---------- Profiles (auto-selected by scripts/anime-detect.lua) ----------
# Shader files go in portable_config/shaders (copy from mpv-anime-build).
[anime-sd]
glsl-shaders-clr
glsl-shaders="~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_S.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_S.glsl"

[anime-hd]
glsl-shaders-clr
glsl-shaders="~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_M.glsl"

[anime-fhd]
glsl-shaders-clr

[live-sd]
glsl-shaders-clr
glsl-shaders="~~/shaders/FSRCNNX_x2_8-0-4-1.glsl"

[live-hd]
glsl-shaders-clr

# Low-power fallback when the RX 580 is loaded (toggle: Ctrl+Alt+L)
[lite]
profile=fast
scale=bilinear
cscale=bilinear
deband=no
glsl-shaders-clr
