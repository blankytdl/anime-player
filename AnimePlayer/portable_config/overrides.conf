# Written/overridden by AnimePlayer Settings. Loaded AFTER the anime build's mpv.conf, so these win.
# Tuned for RX 580 (no NVDEC) + i5-3470: D3D11 hardware decode with copy-back keeps shaders/filters working.
hwdec=d3d11va-copy
vd-lavc-threads=4
# mpv.net quits when the last video ends unless idle=yes; the player stays open so Resume (and Play later) keep working.
idle=yes
