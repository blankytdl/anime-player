name: Build AnimePlayer round 25 (CPU-safe x64)
on:
  push:
    branches: [main]
    paths:
      - 'AnimePlayer-round25*.zip'
      - 'AnimePlayer/**'
      - 'build-source/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: animeplayer-round25-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract, validate, and commit Round-25 source
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $project = $null
          $extract = Join-Path $root '.round25-source'
          $archiveCandidates = @(Get-ChildItem -LiteralPath $root -Filter 'AnimePlayer-round25*.zip' -File)
          if ($archiveCandidates.Count -gt 1) { throw 'More than one Round-25 ZIP was found; keep only the intended current source archive.' }
          if ($archiveCandidates.Count -eq 1) {
            if (Test-Path -LiteralPath $extract) { Remove-Item -LiteralPath $extract -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $extract | Out-Null
            Expand-Archive -LiteralPath $archiveCandidates[0].FullName -DestinationPath $extract -Force
            $buildFiles = @(Get-ChildItem -LiteralPath $extract -Filter 'build.bat' -File -Recurse)
            if ($buildFiles.Count -ne 1) { throw "Expected exactly one build.bat in the Round-25 ZIP; found $($buildFiles.Count)." }
            $project = $buildFiles[0].Directory.FullName
            $targetProject = Join-Path $root 'AnimePlayer'
            if (Test-Path -LiteralPath $targetProject) { Remove-Item -LiteralPath $targetProject -Recurse -Force }
            if ($project -ne $targetProject) {
              Move-Item -LiteralPath $project -Destination $targetProject -Force
              $project = $targetProject
            }
          }
          elseif (Test-Path -LiteralPath (Join-Path $root 'AnimePlayer/build.bat')) {
            $project = Join-Path $root 'AnimePlayer'
          }
          elseif (Test-Path -LiteralPath (Join-Path $root 'build.bat')) {
            $project = $root
          }
          else {
            throw 'Round-25 source is missing. Add the current AnimePlayer-round25 ZIP or the expanded AnimePlayer/ source tree.'
          }
          $buildNumber = (Get-Content -LiteralPath (Join-Path $project 'BUILD.txt') -Raw -ErrorAction Stop).Trim()
          if ($buildNumber -ne '25') { throw "Expected Build 25, found BUILD.txt value '$buildNumber'." }
          if (-not (Test-Path -LiteralPath (Join-Path $project 'ROUND25-FIXES.md'))) { throw 'ROUND25-FIXES.md is missing; refusing to commit a non-Round-25 project.' }
          if (-not (Test-Path -LiteralPath (Join-Path $project 'tools/ci/fetch-dependencies.ps1'))) { throw 'CPU-safe dependency fetch script is missing.' }
          $staleZip = Join-Path $root 'AnimePlayer (1).zip'
          if (Test-Path -LiteralPath $staleZip) { Remove-Item -LiteralPath $staleZip -Force }
          foreach ($candidate in $archiveCandidates) { Remove-Item -LiteralPath $candidate.FullName -Force }
          if (Test-Path -LiteralPath $extract) { Remove-Item -LiteralPath $extract -Recurse -Force }
          git add -A
          $pending = git status --porcelain
          if ($pending) {
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Replace archived AnimePlayer package with Round 25 source'
            if ($LASTEXITCODE -ne 0) { throw 'Could not commit the extracted Round-25 source.' }
            git push origin "HEAD:$env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -ne 0) { throw 'Could not push the extracted Round-25 source commit.' }
          }
          else { Write-Host 'The validated Round-25 source tree is already committed; no source commit needed.' }
          "ANIMEPLAYER_ROOT=$project" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Fetch all four CPU-compatible dependencies
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:ANIMEPLAYER_ROOT
          & ./tools/ci/fetch-dependencies.ps1
          if (-not $?) { throw 'Dependency download or verification failed.' }

      - name: Build portable Windows app
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:ANIMEPLAYER_ROOT
          cmd.exe /d /c build.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'dist')) { throw 'Build did not create the dist directory.' }

      - name: Package portable build
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:ANIMEPLAYER_ROOT
          $manifest = '.ci-downloads/dependency-manifest.txt'
          if (Test-Path $manifest) { Copy-Item $manifest 'dist/dependency-manifest.txt' -Force }
          $out = Join-Path $env:GITHUB_WORKSPACE 'AnimePlayer-build25-windows-x64.zip'
          if (Test-Path $out) { Remove-Item $out -Force }
          Compress-Archive -Path 'dist/*' -DestinationPath $out -CompressionLevel Optimal
          if ((Get-Item $out).Length -lt 1024) { throw 'Build archive is unexpectedly small.' }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimePlayer-build25-windows-x64
          path: AnimePlayer-build25-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
