name: Build AnimePlayer (CPU-safe x64)
on:
  push:
    branches: [main]
    paths:
      - 'AnimePlayer-*.zip'
      - 'AnimePlayer/**'
      - 'build-source/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: animeplayer-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract, validate, and commit source
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $project = $null
          $extract = Join-Path $root '.animeplayer-source'
          $chunkDir = Join-Path $root 'build-source'
          $chunks = @()
          if (Test-Path -LiteralPath $chunkDir) {
            $chunks = @(Get-ChildItem -LiteralPath $chunkDir -Filter '*.b64' -File | Sort-Object Name)
          }
          $archiveCandidates = @(Get-ChildItem -LiteralPath $root -Filter 'AnimePlayer-*.zip' -File)
          if ($chunks.Count -gt 0 -and $archiveCandidates.Count -gt 0) {
            throw 'Provide either the chunked source archive or a ZIP, not both.'
          }
          if ($chunks.Count -gt 0) {
            $encoded = ($chunks | ForEach-Object { (Get-Content -LiteralPath $_.FullName -Raw).Trim() }) -join ''
            if ([string]::IsNullOrWhiteSpace($encoded)) { throw 'Source archive chunks are empty.' }
            $archiveBytes = [Convert]::FromBase64String($encoded)
            $archive = Join-Path $root 'AnimePlayer-source.tar.xz'
            [IO.File]::WriteAllBytes($archive, $archiveBytes)
            if (Test-Path -LiteralPath $extract) { Remove-Item -LiteralPath $extract -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $extract | Out-Null
            & tar.exe -xf $archive -C $extract
            if ($LASTEXITCODE -ne 0) { throw "Could not extract source archive (tar exit $LASTEXITCODE)." }
            $project = Join-Path $extract 'AnimePlayer'
          }
          elseif ($archiveCandidates.Count -eq 1) {
            if (Test-Path -LiteralPath $extract) { Remove-Item -LiteralPath $extract -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $extract | Out-Null
            Expand-Archive -LiteralPath $archiveCandidates[0].FullName -DestinationPath $extract -Force
            $buildFiles = @(Get-ChildItem -LiteralPath $extract -Filter 'build.bat' -File -Recurse)
            if ($buildFiles.Count -ne 1) {
              throw "Expected exactly one build.bat in the source ZIP; found $($buildFiles.Count)."
            }
            $project = $buildFiles[0].Directory.FullName
          }
          elseif ($archiveCandidates.Count -gt 1) {
            throw 'More than one AnimePlayer ZIP was found; keep only the intended archive.'
          }
          elseif (Test-Path -LiteralPath (Join-Path $root 'AnimePlayer/build.bat')) {
            $project = Join-Path $root 'AnimePlayer'
          }
          elseif (Test-Path -LiteralPath (Join-Path $root 'build.bat')) {
            $project = $root
          }
          else {
            throw 'AnimePlayer source is missing. Add an AnimePlayer-*.zip or source files under AnimePlayer/.'
          }

          $targetProject = Join-Path $root 'AnimePlayer'
          if ($project -ne $targetProject -and $project -ne $root) {
            if (Test-Path -LiteralPath $targetProject) { Remove-Item -LiteralPath $targetProject -Recurse -Force }
            Move-Item -LiteralPath $project -Destination $targetProject -Force
            $project = $targetProject
          }

          if (-not (Test-Path -LiteralPath (Join-Path $project 'build.bat'))) {
            throw 'build.bat is missing from the extracted project.'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $project 'tools/ci/fetch-dependencies.ps1'))) {
            throw 'CPU-safe dependency fetch script is missing.'
          }

          $staleZip = Join-Path $root 'AnimePlayer (1).zip'
          if (Test-Path -LiteralPath $staleZip) { Remove-Item -LiteralPath $staleZip -Force }
          foreach ($candidate in $archiveCandidates) { Remove-Item -LiteralPath $candidate.FullName -Force }
          if ($chunks.Count -gt 0) { Remove-Item -LiteralPath $chunkDir -Recurse -Force }
          $tempArchive = Join-Path $root 'AnimePlayer-source.tar.xz'
          if (Test-Path -LiteralPath $tempArchive) { Remove-Item -LiteralPath $tempArchive -Force }
          if (Test-Path -LiteralPath $extract) { Remove-Item -LiteralPath $extract -Recurse -Force }

          git add -A
          $pending = git status --porcelain
          if ($pending) {
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Replace archived AnimePlayer package with current source'
            if ($LASTEXITCODE -ne 0) { throw 'Could not commit the extracted AnimePlayer source.' }
            git push origin "HEAD:$env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -ne 0) { throw 'Could not push the extracted AnimePlayer source commit.' }
          }
          else {
            Write-Host 'The validated AnimePlayer source tree is already committed; no source commit needed.'
          }
          "ANIMEPLAYER_ROOT=$project" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Fetch CPU-compatible dependencies
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:ANIMEPLAYER_ROOT
          & ./tools/ci/fetch-dependencies.ps1
          if (-not $?) { throw 'Dependency download or verification failed.' }

      - name: Build portable Windows app
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:ANIMEPLAYER_ROOT
          cmd.exe /d /c build.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'dist')) { throw 'Build did not create the dist directory.' }

      - name: Package portable build
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:ANIMEPLAYER_ROOT
          $manifest = '.ci-downloads/dependency-manifest.txt'
          if (Test-Path $manifest) { Copy-Item $manifest 'dist/dependency-manifest.txt' -Force }
          $out = Join-Path $env:GITHUB_WORKSPACE 'AnimePlayer-windows-x64.zip'
          if (Test-Path $out) { Remove-Item $out -Force }
          Compress-Archive -Path 'dist/*' -DestinationPath $out -CompressionLevel Optimal
          if ((Get-Item $out).Length -lt 1024) { throw 'Build archive is unexpectedly small.' }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimePlayer-windows-x64
          path: AnimePlayer-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
